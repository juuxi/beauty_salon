      description: |-
        * `int` - Целое число
        * `real` - Вещественное число
        * `enum` - Перечисление
    ParameterNode:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        parameter:
          type: integer
          title: Параметр
        standardnode:
          type: integer
          readOnly: true
          title: Типовой класс
        min_param_value:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
          title: Минимальное значение
        max_param_value:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
          title: Максимальное значение
        num:
          type: integer
          maximum: 2147483647
          minimum: 1
