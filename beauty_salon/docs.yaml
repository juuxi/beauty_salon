          title: Тип данных
        enumeration:
          type: integer
          nullable: true
          title: Перечисление
        measuring_unit:
          type: integer
          nullable: true
          title: Единица измерения
      required:
      - data_type
      - id
      - name
    ParameterDataTypeEnum:
      enum:
      - int
      - real
      - enum
