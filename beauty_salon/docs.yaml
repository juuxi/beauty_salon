components:
  schemas:
    ClassifierNode:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Название
          maxLength: 200
        parent:
          type: integer
          nullable: true
          title: Родительский узел
        is_terminal:
          type: boolean
          title: Является листом
        measuring_unit:
          type: integer
          nullable: true
          title: Единица измерения
        children:
          type: array
          items: {}
          writeOnly: true
        enumerations:
          type: array
          items:
            type: integer
        parameters:
          type: string
          readOnly: true
      required:
      - id
      - name
      - parameters
    Enumeration:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Название
          maxLength: 200
        measuring_unit:
          type: integer
          nullable: true
          title: Единица измерения
        data_type:
          allOf:
          - $ref: '#/components/schemas/EnumerationDataTypeEnum'
          title: Тип данных
      required:
      - data_type
      - id
      - name
    EnumerationDataTypeEnum:
      enum:
      - str
      - int
      - real
      - pic
      type: string
      description: |-
        * `str` - Строка
        * `int` - Целое число
        * `real` - Вещественное число
        * `pic` - Картинка
    Material:
      type: object
      properties:
        name:
          type: string
          title: Название
          maxLength: 200
        code:
          type: string
          nullable: true
          title: Обозначение
          maxLength: 15
        measuring_unit:
          type: integer
          nullable: true
          title: Единица измерения
      required:
      - name
    Parameter:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Название
          maxLength: 200
        data_type:
